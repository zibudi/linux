name: kernel

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - run: sudo apt-get update && sudo apt-get install -y bc bison flex kmod libelf-dev libssl-dev qemu-system-x86

      - name: our OID generator matches the perl it replaces
        run: |
          zig build --fetch
          zig build oid
          script=$(ls zig-pkg/*/lib/build_OID_registry | head -1)
          src=${script%/lib/build_OID_registry}
          srctree=$src perl "$src/lib/build_OID_registry" "$src/include/linux/oid_registry.h" /tmp/perl.c
          srctree=$src ./zig-out/bin/oid "$src/lib/build_OID_registry" "$src/include/linux/oid_registry.h" /tmp/ours.c
          diff /tmp/perl.c /tmp/ours.c
          echo "identical, $(wc -l < /tmp/ours.c) lines"

      - name: gcc is the only thing here we did not build
        run: |
          zig build tools
          ours=$PWD/zig-out/tools
          # zig's install step does not carry symlinks over, so make busybox's
          # names here, the same way installing busybox anywhere else does.
          for applet in $("$ours/busybox" --list); do ln -sf busybox "$ours/$applet"; done
          echo "busybox provides $("$ours/busybox" --list | wc -l) applets"

          # make hardcodes /bin/sh, and the kernel's tools/ sub-build wipes MAKEFLAGS,
          # so a command-line SHELL= cannot reach it. Point /bin/sh at ours instead.
          sudo ln -sf "$ours/sh" /bin/sh

          # Collected first and deleted in one call, because the list includes rm.
          victims="/usr/bin/make /usr/bin/perl /usr/bin/getconf"
          for tool in as ld ld.bfd ld.gold ar nm objcopy objdump readelf strip; do
            victims="$victims /usr/bin/$tool /usr/bin/x86_64-linux-gnu-$tool /usr/x86_64-linux-gnu/bin/$tool"
          done
          for tool in sed grep awk find xargs diff bc cat cp mv rm mkdir rmdir ln \
                      touch basename dirname head tail wc tr cut uniq sort env uname \
                      whoami mktemp readlink expr install sha1sum ls chmod sleep date \
                      seq stat realpath cmp tee nl paste od yes nproc id du df sync tac; do
            victims="$victims /usr/bin/$tool /bin/$tool"
          done
          sudo rm -f $victims

          echo "$ours" >> $GITHUB_PATH
          export PATH="$ours:$PATH"
          for tool in make as ld ar nm objcopy objdump readelf strip perl getconf sed grep awk sh; do
            found=$(command -v $tool || true)
            case "$found" in
              "$ours"/*) ;;
              "") if [ "$tool" != perl ] && [ "$tool" != getconf ]; then echo "$tool is missing"; exit 1; fi ;;
              *) echo "$tool resolves to $found, which we did not build"; exit 1 ;;
            esac
          done
          gcc --version | head -1

      - run: zig build

      - name: what came out
        run: |
          ls -l zig-out/vmlinuz
          echo "aliases: $(wc -l < zig-out/modules/modules.alias)"
          echo "modules: $(find zig-out/modules -name '*.ko' | wc -l)"
          find zig-out/modules -name '*.ko' | sed 's|.*/||' | sort

      - name: kconfig kept every symbol we asked for
        run: |
          fail=0
          while read -r line; do
            case "$line" in
              CONFIG_*) sym=${line%%=*}; want=${line#*=} ;;
              '# CONFIG_'*' is not set') sym=${line#'# '}; sym=${sym%% *}; want=n ;;
              *) continue ;;
            esac
            got=$(grep "^$sym=" zig-out/config | cut -d= -f2)
            [ -n "$got" ] || got=n
            if [ "$got" != "$want" ]; then
              echo "FAIL $sym: asked for $want, got $got"
              fail=1
            fi
          done < config/x86_64.config
          [ $fail -eq 0 ] && echo 'every symbol survived'
          exit $fail

      - name: it boots
        run: |
          timeout 180 qemu-system-x86_64 -kernel zig-out/vmlinuz -nographic -no-reboot \
            -smp 4 -m 1024 -append 'console=ttyS0 panic=-1' > boot.log 2>&1 || true
          tail -30 boot.log
          grep -q 'Linux version 6.12.103' boot.log
          grep -q 'GNU ld (GNU Binutils) 2.45.0' boot.log
          grep -q 'Brought up 1 node, 4 CPUs' boot.log
          grep -q 'Kernel panic' boot.log

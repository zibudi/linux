name: kernel

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: what the distribution's perl makes of the OID registry
        run: |
          zig build --fetch
          script=$(ls zig-pkg/*/lib/build_OID_registry | head -1)
          src=${script%/lib/build_OID_registry}
          echo "$src" > /tmp/kernel-src
          srctree=$src perl "$src/lib/build_OID_registry" "$src/include/linux/oid_registry.h" /tmp/theirs.c
          perl -e 'print "$^V\n"'

      - name: gcc is the only thing here we did not build
        run: |
          zig build tools
          ours=$PWD/zig-out/tools
          # zig's install step does not carry symlinks over, so make busybox's
          # names here, the same way installing busybox anywhere else does.
          for applet in $("$ours/busybox" --list); do ln -sf busybox "$ours/$applet"; done
          echo "busybox provides $("$ours/busybox" --list | wc -l) applets"

          # make hardcodes /bin/sh, and the kernel's tools/ sub-build wipes MAKEFLAGS,
          # so a command-line SHELL= cannot reach it. Point /bin/sh at ours instead.
          sudo ln -sf "$ours/sh" /bin/sh

          # Collected first and deleted in one call, because the list includes rm.
          victims="/usr/bin/make /usr/bin/perl /usr/bin/getconf"
          victims="$victims /usr/bin/bison /usr/bin/flex /usr/bin/m4 /usr/bin/byacc /usr/bin/lex /usr/bin/yacc"
          for tool in as ld ld.bfd ld.gold ar nm objcopy objdump readelf strip; do
            victims="$victims /usr/bin/$tool /usr/bin/x86_64-linux-gnu-$tool /usr/x86_64-linux-gnu/bin/$tool"
          done
          # /usr/bin/env stays: zig reads it as an ELF file to work out the native
          # libc and its version. Delete it and zig decides the host is musl, then
          # builds against glibc headers anyway. Ours still shadows it on PATH.
          for tool in sed grep awk find xargs diff bc cat cp mv rm mkdir rmdir ln \
                      touch basename dirname head tail wc tr cut uniq sort uname \
                      whoami mktemp readlink expr install sha1sum ls chmod sleep date \
                      seq stat realpath cmp tee nl paste od yes nproc id du df sync tac; do
            victims="$victims /usr/bin/$tool /bin/$tool"
          done
          sudo rm -f $victims

          echo "$ours" >> $GITHUB_PATH
          export PATH="$ours:$PATH"
          for tool in make as ld ar nm objcopy objdump readelf strip perl getconf \
                      sed grep awk sh flex byacc m4 bc bison; do
            found=$(command -v $tool || true)
            case "$found" in
              "$ours"/*) ;;
              "") case "$tool" in perl|getconf|bison) ;; *) echo "$tool is missing"; exit 1 ;; esac ;;
              *) echo "$tool resolves to $found, which we did not build"; exit 1 ;;
            esac
          done
          gcc --version | head -1

      - name: the perl we built makes the same of it
        run: |
          zig build perl
          src=$(cat /tmp/kernel-src)
          ours=$PWD/zig-out/perl/bin/perl
          "$ours" -e 'print "$^V\n"'
          srctree=$src "$ours" "$src/lib/build_OID_registry" "$src/include/linux/oid_registry.h" /tmp/ours.c
          diff /tmp/theirs.c /tmp/ours.c
          echo "identical, $(wc -l < /tmp/ours.c) lines"

      - name: busybox's generated files are what its own scripts write
        run: |
          ours=$PWD/zig-out/tools
          src=$(cd $(ls -d zig-pkg/busybox-*/ | head -1) && pwd)
          out=$(mktemp -d)
          cd "$out"
          mkdir -p include
          cp "$src/config/zibudi.config" .config
          # Every tool these reach for is ours: the shell, and the sed, cat, cmp,
          # find, od and dd they run.
          "$ours/sh" "$src/scripts/gen_build_files.sh" "$src" .
          "$ours/sh" "$src/scripts/embedded_scripts" include/embedded_scripts.h
          "$ours/sh" "$src/scripts/generate_BUFSIZ.sh" include/common_bufsiz.h
          n=0
          for f in $(find include -name '*.h') $(find . -name Config.in); do
            diff "$src/generated/${f#./}" "$f"
            n=$((n + 1))
          done
          echo "$n files, all identical to what upstream's scripts wrote"

      - run: zig build

      - name: what came out
        run: |
          ls -l zig-out/vmlinuz
          echo "aliases: $(wc -l < zig-out/modules/modules.alias)"
          echo "modules: $(find zig-out/modules -name '*.ko' | wc -l)"
          find zig-out/modules -name '*.ko' | sed 's|.*/||' | sort

      - name: kconfig kept every symbol we asked for
        run: |
          fail=0
          while read -r line; do
            case "$line" in
              CONFIG_*) sym=${line%%=*}; want=${line#*=} ;;
              '# CONFIG_'*' is not set') sym=${line#'# '}; sym=${sym%% *}; want=n ;;
              *) continue ;;
            esac
            got=$(grep "^$sym=" zig-out/config | cut -d= -f2)
            [ -n "$got" ] || got=n
            if [ "$got" != "$want" ]; then
              echo "FAIL $sym: asked for $want, got $got"
              fail=1
            fi
          done < config/x86_64.config
          [ $fail -eq 0 ] && echo 'every symbol survived'
          exit $fail

      - name: it boots
        run: |
          timeout 180 qemu-system-x86_64 -kernel zig-out/vmlinuz -nographic -no-reboot \
            -smp 4 -m 1024 -append 'console=ttyS0 panic=-1' > boot.log 2>&1 || true
          tail -30 boot.log
          grep -q 'Linux version 6.12.103' boot.log
          grep -q 'GNU ld (GNU Binutils) 2.45.0' boot.log
          grep -q 'Brought up 1 node, 4 CPUs' boot.log
          grep -q 'Kernel panic' boot.log

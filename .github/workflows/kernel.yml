# The from-source build only runs here. It needs a case-sensitive filesystem
# and a gcc, which is exactly what a Mac does not have.
name: kernel

# A branch with a PR open would otherwise build twice for one commit, and a
# kernel build is not cheap enough to do that. Superseded runs stop.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y bc bison flex kmod libelf-dev libssl-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: zig build -Dsource=source

      - name: what came out
        run: |
          ls -l zig-out/vmlinuz
          echo "aliases: $(wc -l < zig-out/modules/modules.alias)"
          echo "modules: $(find zig-out/modules -name '*.ko' | wc -l)"
          find zig-out/modules -name '*.ko' | sed 's|.*/||' | sort

      # The claim this whole path exists to make. kconfig silently drops a
      # symbol whose dependencies are unmet, which would hand us back the
      # builtin driver we were trying to get rid of -- and the initramfs would
      # boot anyway, proving nothing.
      - name: the config we asked for is the config we got
        run: |
          fail=0
          while read -r line; do
            case "$line" in CONFIG_*) ;; *) continue ;; esac
            sym=${line%%=*}
            want=${line#*=}
            got=$(grep "^$sym=" zig-out/config | cut -d= -f2)
            [ -n "$got" ] || got='(dropped)'
            if [ "$got" != "$want" ]; then
              echo "FAIL $sym: asked for $want, got $got"
              fail=1
            fi
          done < config/x86_64.config
          [ $fail -eq 0 ] && echo 'every symbol in the fragment survived'
          exit $fail
